<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Enter Card Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#047195",
                        "background-light": "#f5f7fa",
                        "background-dark": "#0e1216",
                        "surface-dark": "#17212F",
                        "border-dark": "#2d3748"
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .credit-card-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .card-chip {
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100 min-h-screen">
<div class="max-w-[430px] mx-auto min-h-screen flex flex-col relative shadow-2xl bg-background-light dark:bg-background-dark">
<div class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
<div class="flex items-center p-4 justify-between">
<div class="flex size-10 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors cursor-pointer">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300">chevron_left</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Enter Card Details</h2>
</div>
</div>
<main class="flex-1 overflow-y-auto pb-32">
<div class="px-5 pt-8 pb-4 text-center">
<p class="text-xs text-gray-500 dark:text-gray-400 font-medium uppercase tracking-[0.2em] mb-1">Initial Balance</p>
<h1 class="text-4xl font-bold tracking-tight text-primary">$2,360.00</h1>
</div>
<div class="px-5 py-6">
<div class="aspect-[1.586/1] w-full credit-card-gradient rounded-2xl p-6 shadow-2xl relative overflow-hidden border border-white/10">
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_50%_50%,#fff,transparent)] pointer-events-none"></div>
<div class="flex justify-between items-start relative z-10">
<div class="w-12 h-9 card-chip opacity-80"></div>
<div class="flex flex-col items-end">
<span class="italic font-bold text-white/80 text-xl tracking-tighter">VISA</span>
</div>
</div>
<div class="mt-8 relative z-10">
<p class="text-white/40 text-[10px] uppercase tracking-widest mb-1">Card Number</p>
<p class="text-white text-xl font-medium tracking-[0.15em] drop-shadow-md">4532 8271 9022 4410</p>
</div>
<div class="mt-6 flex justify-between items-end relative z-10">
<div class="flex-1">
<p class="text-white/40 text-[10px] uppercase tracking-widest mb-1">Cardholder</p>
<p class="text-white text-sm font-semibold uppercase tracking-wider">Alex Johnson</p>
</div>
<div class="flex gap-4">
<div>
<p class="text-white/40 text-[10px] uppercase tracking-widest mb-1">Expires</p>
<p class="text-white text-sm font-semibold">12/28</p>
</div>
<div>
<p class="text-white/40 text-[10px] uppercase tracking-widest mb-1">CVV</p>
<p class="text-white text-sm font-semibold">***</p>
</div>
</div>
</div>
</div>
</div>
<div class="px-5 space-y-4">
<div class="flex flex-col gap-2 p-4 rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark shadow-sm">
<label class="flex flex-col w-full">
<p class="text-xs font-semibold text-gray-600 dark:text-gray-400 pb-2 uppercase tracking-wider">Cardholder Name</p>
<input class="form-input w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1b2427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-[#5a6e75] px-4 font-medium" placeholder="Name as on card" type="text" value="Alex Johnson"/>
</label>
</div>
<div class="flex flex-col gap-2 p-4 rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark shadow-sm">
<label class="flex flex-col w-full">
<p class="text-xs font-semibold text-gray-600 dark:text-gray-400 pb-2 uppercase tracking-wider">Card Number</p>
<div class="relative">
<input class="form-input w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1b2427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-[#5a6e75] px-4 font-medium tracking-widest" placeholder="0000 0000 0000 0000" type="text" value="4532 8271 9022 4410"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-400 text-xl">credit_card</span>
</div>
</label>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2 p-4 rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark shadow-sm">
<label class="flex flex-col w-full">
<p class="text-xs font-semibold text-gray-600 dark:text-gray-400 pb-2 uppercase tracking-wider">Expiry Date</p>
<input class="form-input w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1b2427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-[#5a6e75] px-4 font-medium" placeholder="MM/YY" type="text" value="12/28"/>
</label>
</div>
<div class="flex flex-col gap-2 p-4 rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark shadow-sm">
<label class="flex flex-col w-full">
<p class="text-xs font-semibold text-gray-600 dark:text-gray-400 pb-2 uppercase tracking-wider">CVV</p>
<input class="form-input w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#1b2427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-[#5a6e75] px-4 font-medium" placeholder="123" type="password" value="***"/>
</label>
</div>
</div>
</div>
<div class="px-5 py-6 text-center">
<p class="text-xs text-gray-500 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">lock</span>
                    Your card information is encrypted and secure
                </p>
</div>
</main>
<div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light dark:via-background-dark to-transparent pt-10">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Save Card</span>
<span class="material-symbols-outlined text-[20px]">check_circle</span>
</button>
</div>
</div>

</body></html>
