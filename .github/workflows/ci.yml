name: Flutter CI

on:
  push:
    branches:
      - development
      - feature/*
      - new-design
  pull_request:
    branches:
      - development
      - feature/*
      - new-design

permissions:
  contents: read

jobs:
  Analyze-And-Test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: |
          find lib test -name "*.dart" -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Run Flutter analyzer
        run: flutter analyze

      # - name: Run tests with coverage
      #   run: flutter test --coverage

      # - name: Upload coverage artifact
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage
      #     path: coverage/lcov.info
      #     if-no-files-found: ignore